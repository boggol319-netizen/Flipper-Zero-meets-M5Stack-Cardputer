name: dodep_build

on:
  workflow_dispatch:
    inputs:
      nfc_addr:
        description: 'PN532 I2C address (0x28 default, or 0x24 for most PN532 boards)'
        required: false
        default: '0x28'
        type: string
  push:
    branches: [dodep]

jobs:
  build:
    name: Build cardputer_adv (dodep pins, NFC ${{ github.event.inputs.nfc_addr || '0x28' }})
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: V1.15
          submodules: recursive

      - name: Install ESP-IDF system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git wget flex bison gperf python3 python3-pip python3-venv \
            cmake ninja-build ccache libffi-dev libssl-dev dfu-util \
            libusb-1.0-0 libglib2.0-dev

      - name: Cache ESP-IDF
        uses: actions/cache@v4
        id: idf-cache
        with:
          path: ~/esp/esp-idf
          key: esp-idf-v5.4.1

      - name: Clone ESP-IDF v5.4.1
        if: steps.idf-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/esp
          git clone --branch v5.4.1 --depth 1 \
            https://github.com/espressif/esp-idf.git ~/esp/esp-idf

      - name: Cache ESP-IDF tools
        uses: actions/cache@v4
        id: idf-tools-cache
        with:
          path: ~/.espressif
          key: esp-idf-tools-v5.4.1

      - name: Install ESP-IDF tools
        if: steps.idf-tools-cache.outputs.cache-hit != 'true'
        run: |
          ~/esp/esp-idf/install.sh all

      - name: Apply dodep pin + NRF24/keyboard multiplexing patch
        run: |
          python3 - <<'PY'
          import io, sys

          def patch(path, replacements):
              with open(path, 'r', encoding='utf-8') as f:
                  s = f.read()
              for i, (old, new) in enumerate(replacements):
                  cnt = s.count(old)
                  if cnt != 1:
                      raise SystemExit("ERROR: anchor %d in %s matched %d times (expected 1)" % (i, path, cnt))
                  s = s.replace(old, new)
              with open(path, 'w', encoding='utf-8') as f:
                  f.write(s)
              print("patched:", path)

          # ---- Board header: CC1101 + NRF24 pins ----
          board = "components/furi_hal/boards/board_m5stack_cardputer_adv.h"
          patch(board, [
              ("#define BOARD_PIN_CC1101_CSN    13\n",
               "#define BOARD_PIN_CC1101_CSN    15\n"),
              ("#define BOARD_PIN_CC1101_GDO0   5\n",
               "#define BOARD_PIN_CC1101_GDO0   13\n"),
              ("#define BOARD_PIN_NRF24_CSN     6\n",
               "#define BOARD_PIN_NRF24_CSN     9\n"),
               ("#define BOARD_PIN_NRF24_CE      4\n",
                "#define BOARD_PIN_NRF24_CE      8\n"),
           ])

          # ---- PN532 NFC I2C address (most boards default 0x24, ADV header says 0x28) ----
          nfc_addr = "${{ github.event.inputs.nfc_addr || '0x28' }}"
          patch(board, [
              ("#define BOARD_NFC_I2C_ADDR      0x28  /* WS1850S default; same as PN532 */\n",
               "#define BOARD_NFC_I2C_ADDR      %s  /* PN532 I2C address (set via workflow input) */\n" % nfc_addr),
          ])

          # ---- target_input.c: GPIO8/9 multiplexing (keyboard I2C <-> NRF24) ----
          ti = "targets/m5stack_cardputer_adv/target_input.c"
          release_fn = '''static void kb_i2c_release(void) {
              if (kb_i2c_installed) {
                  i2c_driver_delete(KB_I2C_PORT);
                  kb_i2c_installed = false;
              }
              gpio_reset_pin(KB_PIN_SDA);
              gpio_reset_pin(KB_PIN_SCL);
              gpio_set_direction(KB_PIN_SDA, GPIO_MODE_OUTPUT);
              gpio_set_direction(KB_PIN_SCL, GPIO_MODE_OUTPUT);
              gpio_set_level(KB_PIN_SDA, 1); /* NRF24 CSN high (deselected) */
              gpio_set_level(KB_PIN_SCL, 0); /* NRF24 CE low */
          }
          '''
          patch(ti, [
              (# after kb_i2c_install() definition
               "    kb_i2c_installed = true;\n"
               "    ESP_LOGI(TAG, \"TCA8418 legacy I2C on GPIO%d/GPIO%d (port %d)\", KB_PIN_SDA, KB_PIN_SCL, KB_I2C_PORT);\n"
               "    return ESP_OK;\n"
               "}\n",
               "    kb_i2c_installed = true;\n"
               "    ESP_LOGI(TAG, \"TCA8418 legacy I2C on GPIO%d/GPIO%d (port %d)\", KB_PIN_SDA, KB_PIN_SCL, KB_I2C_PORT);\n"
               "    return ESP_OK;\n"
               "}\n\n" + release_fn),
              (# end of target_input_init()
               "             TCA_KEY_DARROW, TCA_KEY_LARROW, TCA_KEY_RARROW);\n"
               "}\n",
               "             TCA_KEY_DARROW, TCA_KEY_LARROW, TCA_KEY_RARROW);\n\n"
               "    /* Release SDA/SCL (GPIO8/9) back to NRF24 until the first poll. */\n"
               "    kb_i2c_release();\n"
               "}\n"),
              (# start of target_input_poll()
               "    uint32_t repeat_ticks     = furi_ms_to_ticks(INPUT_REPEAT_MS);\n\n",
               "    uint32_t repeat_ticks     = furi_ms_to_ticks(INPUT_REPEAT_MS);\n\n"
               "    /* Re-acquire keyboard I2C (GPIO8/9) before reading; released at poll end. */\n"
               "    kb_i2c_install();\n\n"),
              (# before long_press_check
               "    /* Clear interrupt flag after draining */\n"
               "    tca_write(TCA8418_REG_INT_STAT, 0x01);\n\n"
               "long_press_check:\n",
               "    /* Clear interrupt flag after draining */\n"
               "    tca_write(TCA8418_REG_INT_STAT, 0x01);\n\n"
               "    /* Release SDA/SCL (GPIO8/9) back to NRF24 until the next poll. */\n"
               "    kb_i2c_release();\n\n"
               "long_press_check:\n"),
          ])
          print("ALL PATCHES APPLIED OK")
          PY

      - name: Clean stale sdkconfig
        run: |
          rm -f sdkconfig
          rm -f build_cardputer_adv/sdkconfig

      - name: Ensure Pillow (FAP icon generation needs it)
        run: |
          PY="$HOME/.espressif/python_env/idf5.4_py3.12_env/bin/python"
          if [ -x "$PY" ]; then "$PY" -m pip install --quiet pillow || true; else python3 -m pip install --quiet pillow || true; fi

      - name: Provide missing app icon assets (stock board build fix)
        run: |
          python3 - <<'PY'
          import os, re, base64
          ICON_B64 = "iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAIAAACQkWg2AAAAFElEQVR42mP4TyJgGNUwqmH4agAAr639H23ooMoAAAAASUVORK5CYII="
          png = base64.b64decode(ICON_B64)
          roots = ["applications", "port_apps", "applications_user"]
          for root in roots:
              if not os.path.isdir(root):
                  continue
              for dirpath, dirnames, filenames in os.walk(root):
                  fam = next((f for f in filenames if f.endswith(".fam")), None)
                  if not fam:
                      continue
                  txt = open(os.path.join(dirpath, fam), encoding="utf-8").read()
                  m = re.search(r'fap_icon_assets\s*=\s*"([^"]+)"', txt)
                  if not m:
                      continue
                  assets_dir = os.path.join(dirpath, m.group(1))
                  has_png = os.path.isdir(assets_dir) and any(
                      fn.endswith(".png") for fn in os.listdir(assets_dir)
                  )
                  if has_png:
                      continue
                  os.makedirs(assets_dir, exist_ok=True)
                  im = re.search(r'fap_icon\s*=\s*"([^"]+)"', txt)
                  icon_name = im.group(1) if im else "icon.png"
                  if not icon_name.endswith(".png"):
                      icon_name += ".png"
                  with open(os.path.join(assets_dir, icon_name), "wb") as fh:
                      fh.write(png)
                  print("added placeholder icon:", os.path.join(assets_dir, icon_name))
          PY

      - name: Drop broken stock app 'key_copier' (V1.15 is missing key_formats.h/icon)
        run: |
          rm -rf port_apps/key_copier

      - name: Exclude 'key_copier' from app build list (fam_config.py)
        run: |
          python3 - <<'PY'
          p = "fam_config.py"
          s = open(p, encoding="utf-8").read()
          old = '    "js_blebeacon",\n    # js_serial, js_gpio, js_i2c, js_spi excluded - need HAL porting\n    "key_copier",\n'
          new = '    "js_blebeacon",\n    # js_serial, js_gpio, js_i2c, js_spi excluded - need HAL porting\n'
          assert s.count(old) == 1, "key_copier anchor not found in fam_config.py"
          open(p, "w", encoding="utf-8").write(s.replace(old, new))
          print("removed key_copier from APPS")
          PY

      - name: Build cardputer_adv (build + merge)
        run: |
          source ~/esp/esp-idf/export.sh
          chmod +x ./build.sh
          ./build.sh --board cardputer_adv --build-only

      - name: Stage dodep.bin
        run: |
          if [ -f Flipper-cardputer_adv-merged.bin ]; then
            NFC="${{ github.event.inputs.nfc_addr || '0x28' }}"
            BIN="dodep_nfc${NFC}.bin"
            cp Flipper-cardputer_adv-merged.bin "$BIN"
            ls -lh "$BIN"
          else
            echo "MERGED BINARY NOT FOUND"; ls -lh . ; exit 1
          fi

      - name: Upload dodep.bin
        uses: actions/upload-artifact@v4
        with:
          name: dodep-bin
          path: dodep_nfc*.bin
          retention-days: 30
